x-qwen-template: &qwen-template
  build:
    context: ./qwen
    dockerfile: Dockerfile
  image: fif-qwen-image
  profiles: [ "qwen-worker" ]
  command: >
    --model Qwen/Qwen3-VL-8B-Instruct --trust-remote-code --gpu-memory-utilization 0.9 --max-model-len 16384 --enable-prefix-caching
  networks:
    - network
  shm_size: '16gb'
  volumes:
    - ./qwen:/app
    - ./qwen/hf_models:/root/.cache/huggingface
    - ./dataset:/dataset
    - ./global:/shared:ro
  environment: &qwen-env
    MODEL_PATH: "Qwen/Qwen3-VL-8B-Instruct"
    HF_HOME: "/root/.cache/huggingface"
    NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    PYTHONPATH: "/shared:/shared"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            capabilities: [ gpu ]
  tty: true
  stdin_open: true

services:
  graph:
    build:
      context: ./graph
      dockerfile: Dockerfile
    container_name: fif-graph
    profiles: [ "graph" ]
    networks:
      - network
    image: fif-graph-image
    shm_size: '16gb'
    volumes:
      - ./graph:/app
      - ./graph/hf_cache:/root/.cache/huggingface
      - ./dataset:/dataset
      - ./global:/shared:ro
    environment:
      PYTHONPATH: "/shared:/shared"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '1' ]
              capabilities: [ gpu ]
    tty: true
    stdin_open: true

  qwen-worker-0:
    <<: *qwen-template
    container_name: fif-qwen-worker-0
    environment:
      <<: *qwen-env
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '1' ]
              capabilities: [ gpu ]

  qwen-worker-1:
    <<: *qwen-template
    container_name: fif-qwen-worker-1
    environment:
      <<: *qwen-env
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '2' ]
              capabilities: [ gpu ]

  qwen-worker-2:
    <<: *qwen-template
    container_name: fif-qwen-worker-2
    environment:
      <<: *qwen-env
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '3' ]
              capabilities: [ gpu ]

  mmembed:
    build:
      context: ./mmembed
      dockerfile: Dockerfile
    profiles: [ "mmembed" ]
    container_name: fif-mmembed
    image: fif-mmembed-image
    networks:
      - network
    shm_size: '16gb'
    volumes:
      - ./mmembed:/app
      - ./mmembed/hf_models:/root/.cache/huggingface
      - ./dataset:/dataset
      - ./global:/shared:ro
    environment:
      - MODEL_PATH=nvidia/MM-Embed
      - HF_HOME=/root/.cache/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONPATH=/shared:/shared
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    command: python -u server.py --gpus 2,3 --port 8000
    tty: true
    stdin_open: true

networks:
  network:
    driver: bridge
